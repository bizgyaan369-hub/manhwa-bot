name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          unzip -o manhwa-bot.zip -x "manhwa-bot/.github/*"
          cp -a manhwa-bot/. .
          rm -rf manhwa-bot manhwa-bot.zip
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "unzip files"
          git push
